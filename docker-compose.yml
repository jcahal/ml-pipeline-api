services:
  api:
    build: .
    ports:
      - "80:8000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./models:/app/models
    restart: always

  mlflow:
    image: python:3.11-slim
    profiles:
      - dev
    command: bash -c "pip install mlflow==2.13.0 -q && mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns"
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/app/mlruns

  notebook:
    image: jupyter/scipy-notebook:latest
    profiles:
      - dev
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    working_dir: /home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes

  shell:
    image: python:3.11-slim
    profiles:
      - dev
    command: sleep infinity
    volumes:
      - .:/app
    working_dir: /app